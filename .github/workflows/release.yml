name: Build and release Windows portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rulership-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check public files
        shell: pwsh
        run: ./scripts/Check-Privacy.ps1
      - name: Build and test updater
        shell: pwsh
        run: |
          dotnet build Rulership-Pin.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet bin/Release/net10.0-windows/Rulership-Pin.dll --test-updater artifacts/UpdateChecks
          if ($LASTEXITCODE -ne 0) { throw 'Updater checks failed' }
          dotnet bin/Release/net10.0-windows/Rulership-Pin.dll --render-chibi-reactions artifacts/ChibiChecks
          if ($LASTEXITCODE -ne 0) { throw 'Animation checks failed' }
      - name: Package portable app
        shell: pwsh
        run: ./scripts/Package.ps1
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rulership-Pin-win-x64
          path: |
            Rulership-Pin-Portable-win-x64.zip
            Rulership-Pin-Portable-win-x64.zip.sha256
      - name: Publish a new version once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content Rulership-Pin.csproj
          $tag = 'v' + $project.Project.PropertyGroup.Version
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "$tag is already published. Bump Version for the next release."; exit 0 }
          gh release create $tag Rulership-Pin-Portable-win-x64.zip Rulership-Pin-Portable-win-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Rulership-Pin $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
